# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master, dev]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main, master]

name: R-CMD-check.yaml

permissions: read-all

jobs:
  check:
    runs-on: ${{ matrix.config.os }}
    # R-devel and its Bioconductor change often, so they inform without blocking a release.
    continue-on-error: ${{ matrix.config.r == 'devel' }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          upgrade: 'TRUE'

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      # Logs need a login, so also report check problems as public annotations.
      - name: Annotate check problems
        if: failure()
        shell: bash
        run: |
          f=$(find check -name 00check.log | head -n 1)
          if [ -n "$f" ]; then
            msg=$(grep -E -A6 'ERROR|WARNING' "$f" | tail -n 25 | sed 's/%/%25/g' | tr '\n' '~' | sed 's/~/%0A/g' | cut -c1-2500)
            echo "::error title=R CMD check::$msg"
          fi
          t=$(find check -name 'testthat.Rout.fail' | head -n 1)
          if [ -n "$t" ]; then
            msg=$(tail -n 25 "$t" | sed 's/%/%25/g' | tr '\n' '~' | sed 's/~/%0A/g' | cut -c1-2500)
            echo "::error title=Test failures::$msg"
          fi

  # One stable result for the check that the protect_main ruleset requires.
  R-CMD-check:
    if: always()
    needs: check
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.check.result }}" = "success"
