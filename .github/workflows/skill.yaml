# Checks that the end-user skill and tutorials agree with the code.
name: skill

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
      - run: Rscript --vanilla tools/dev/validate-skill.R .
